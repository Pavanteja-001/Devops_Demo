apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresdbs.database.devops.example.com
spec:
  group: database.devops.example.com
  names:
    kind: PostgresDB
    listKind: PostgresDBList
    plural: postgresdbs
    singular: postgresdb
    shortNames:
    - pgdb      # 👈 Changed from pdb to pgdb to avoid conflict with PodDisruptionBudget!
    - pg
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: ["dbName", "storageSize"]
            properties:
              dbName:
                type: string
                description: "Name of the Postgres database"
              engineVersion:
                type: string
                description: "Postgres engine version (e.g. 15, 16)"
              storageSize:
                type: string
                description: "Storage size for the database volume (e.g. 10Gi)"
              replicas:
                type: integer
                minimum: 1
                maximum: 5
                description: "Number of database read replicas"
    additionalPrinterColumns:
    - name: DB Name
      type: string
      jsonPath: .spec.dbName
    - name: Version
      type: string
      jsonPath: .spec.engineVersion
    - name: Storage
      type: string
      jsonPath: .spec.storageSize
