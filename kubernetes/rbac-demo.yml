apiVersion: v1
kind: Namespace
metadata:
  name: dev-team
---
# 1. THE WHO: A ServiceAccount representing Developer Bob
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer-bob
  namespace: dev-team
---
# 2. THE WHAT: A Role that only allows reading (viewing) Pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: dev-team
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"] # Read-only permissions!
---
# 3. THE GLUE: A RoleBinding attaching Bob to the pod-reader Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-binding
  namespace: dev-team
subjects:
- kind: ServiceAccount
  name: developer-bob
  namespace: dev-team
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
